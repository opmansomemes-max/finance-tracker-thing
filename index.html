<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger – Personal Finance Tracker</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>
  :root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{background:#0b1114;color:#e2e8f0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .num{font-variant-numeric:tabular-nums}
  input[type=date]{color-scheme:dark}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ---------- Setup: React + htm (JSX-free templates), inline Lucide-style icons ---------- */
const { useState, useEffect, useMemo } = React;
const html = htm.bind(React.createElement);

// Lucide icon paths (inline so no extra network host is needed)
const ICONS = {
  layout:"M3 3h7v9H3z M14 3h7v5h-7z M14 12h7v9h-7z M3 16h7v5H3z",
  arrows:"M17 3l4 4-4 4 M3 7h18 M7 21l-4-4 4-4 M21 17H3",
  bank:"M3 22h18 M6 18v-7 M10 18v-7 M14 18v-7 M18 18v-7 M12 2l8 5H4z",
  brief:"M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16 M2 7h20v13H2z",
  up:"M22 7l-8.5 8.5-5-5L2 17 M16 7h6v6",
  down:"M22 17l-8.5-8.5-5 5L2 7 M16 17h6v-6",
  wallet:"M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2 M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4",
  plus:"M5 12h14 M12 5v14",
  trash:"M3 6h18 M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6 M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2 M10 11v6 M14 11v6",
  left:"M15 18l-6-6 6-6", right:"M9 18l6-6-6-6",
  cal:"M8 2v4 M16 2v4 M3 4h18v18H3z M3 10h18",
  alert:"M12 9v4 M12 17h.01 M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z",
  scale:"M12 3v18 M5 21h14 M4 7h16 M4 7l-2 8a3 3 0 0 0 4 0z M20 7l-2 8a3 3 0 0 0 4 0z"
};
const Icon = ({ n, s = 18, c = "" }) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className=${c}><path d=${ICONS[n]}/></svg>`;

/* ---------- Helpers ---------- */
const IDR = new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 });
const rp = n => IDR.format(Math.round(n || 0)).replace(/\s/g, " ");
const compact = n => new Intl.NumberFormat("en", { notation: "compact" }).format(n);
const pad = n => String(n).padStart(2, "0");
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const uid = () => Math.random().toString(36).slice(2, 9);
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmtDate = d => d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const CATS = ["Salary","Business","Investment","Food","Transport","Housing","Bills","Shopping","Health","Entertainment","Other"];
const STORE = "ledger-data-v1";
const EMPTY = () => ({
  tx: [],
  savings: [0,1,2].map(() => ({ name: "", balance: 0, rate: 0 })),   // exactly 3 accounts
  deposit: { amount: 0, rate: 0, term: 12, start: todayStr(), freq: 12 },       // exactly 1 deposit
  assets: []
});
const load = () => { try { const r = localStorage.getItem(STORE); if (r) return JSON.parse(r); } catch (e) {} return EMPTY(); };

const inp = "w-full bg-[#0b1114] border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-400";
const btn = "inline-flex items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-medium transition-colors";
const panel = "rounded-2xl border border-slate-800 bg-[#111a1e] p-4 sm:p-5";
const tone = n => n > 0 ? "text-emerald-400" : n < 0 ? "text-rose-400" : "text-slate-300";

const Field = ({ label, children }) => html`<label className="block"><span className="mb-1 block text-xs text-slate-400">${label}</span>${children}</label>`;
const Empty = ({ icon, text }) => html`<div className="flex flex-col items-center gap-2 py-8 text-center text-sm text-slate-500"><${Icon} n=${icon} s=${26}/>${text}</div>`;
const Stat = ({ label, value, icon, cls = "text-slate-100", sub }) => html`
  <div className=${panel}>
    <div className="flex items-center justify-between text-slate-400 text-sm">${label}<${Icon} n=${icon} c="text-slate-500"/></div>
    <div className=${"num mt-2 text-xl sm:text-2xl font-semibold break-words " + cls}>${value}</div>
    ${sub && html`<div className="mt-1 text-xs text-slate-500">${sub}</div>`}
  </div>`;

/* ---------- Interactive income vs spending bar chart (SVG) ---------- */
function Bars({ data }) {
  const [hi, setHi] = useState(null);
  const max = Math.max(1, ...data.flatMap(d => [d.inc, d.exp]));
  const W = 640, H = 200, bw = W / data.length;
  const any = data.some(d => d.inc || d.exp);
  const sel = hi != null ? data[hi] : null;
  return html`<div>
    <div className="mb-2 flex flex-wrap items-center gap-4 text-xs text-slate-400">
      <span className="flex items-center gap-1"><i className="h-2 w-2 rounded-full bg-emerald-400"></i>Income</span>
      <span className="flex items-center gap-1"><i className="h-2 w-2 rounded-full bg-rose-400"></i>Expenses</span>
      <span className="num ml-auto min-h-[1rem] text-slate-300">${sel ? `${sel.label}: +${rp(sel.inc)} / −${rp(sel.exp)}` : "Hover a bar for details"}</span>
    </div>
    <div className="overflow-x-auto"><svg viewBox=${`0 0 ${W} ${H + 18}`} className="w-full min-w-[420px]" onMouseLeave=${() => setHi(null)}>
      ${[0.25,0.5,0.75,1].map(f => html`<line key=${f} x1="0" x2=${W} y1=${H - H*f} y2=${H - H*f} stroke="#1e2b31" strokeWidth="1"/>`)}
      ${data.map((d, i) => html`<g key=${i} onMouseEnter=${() => setHi(i)} onClick=${() => setHi(i)}>
        <rect x=${i*bw} y="0" width=${bw} height=${H} fill=${hi === i ? "#ffffff0d" : "transparent"}/>
        <rect x=${i*bw + bw*0.14} y=${H - (d.inc/max)*H} width=${bw*0.34} height=${(d.inc/max)*H} rx="2" fill="#34d399"/>
        <rect x=${i*bw + bw*0.52} y=${H - (d.exp/max)*H} width=${bw*0.34} height=${(d.exp/max)*H} rx="2" fill="#fb7185"/>
        ${(data.length <= 12 || i % 5 === 0) && html`<text x=${i*bw + bw/2} y=${H + 13} textAnchor="middle" fontSize="10" fill="#64748b">${d.short}</text>`}
      </g>`)}
    </svg></div>
    ${!any && html`<p className="mt-1 text-center text-xs text-slate-500">No transactions in this period yet — the chart fills in as you add them.</p>`}
  </div>`;
}

/* ---------- App ---------- */
function App() {
  const now = new Date();
  const [data, setData] = useState(load);
  const [tab, setTab] = useState("summary");
  const [mode, setMode] = useState("month");                       // "month" | "year"
  const [y, setY] = useState(now.getFullYear());
  const [m, setM] = useState(now.getMonth());
  const [clock, setClock] = useState(new Date());
  const [reset, setReset] = useState(0);                           // 0 closed, 1 first confirm, 2 type DELETE
  const [word, setWord] = useState("");

  useEffect(() => { try { localStorage.setItem(STORE, JSON.stringify(data)); } catch (e) {} }, [data]);
  useEffect(() => { const t = setInterval(() => setClock(new Date()), 1000); return () => clearInterval(t); }, []);

  const prefix = mode === "month" ? `${y}-${pad(m+1)}` : `${y}`;
  const label = mode === "month" ? `${MONTHS[m]} ${y}` : `${y}`;
  const shift = dir => {
    if (mode === "year") return setY(y + dir);
    const t = new Date(y, m + dir, 1); setY(t.getFullYear()); setM(t.getMonth());
  };
  const sum = (list, type) => list.filter(t => t.type === type).reduce((a, t) => a + t.amount, 0);
  const periodTx = useMemo(() => data.tx.filter(t => t.date.startsWith(prefix)), [data.tx, prefix]);
  const income = sum(periodTx, "income"), expense = sum(periodTx, "expense"), net = income - expense;

  // Cumulative cash flow up to the end of the selected period
  const endKey = mode === "month" ? `${y}-${pad(m+1)}-99` : `${y}-99-99`;
  const cumulative = data.tx.filter(t => t.date <= endKey).reduce((a, t) => a + (t.type === "income" ? t.amount : -t.amount), 0);
  const savingsTotal = data.savings.reduce((a, s) => a + (+s.balance || 0), 0);
  const depositAmt = +data.deposit.amount || 0;
  const assetsValue = data.assets.reduce((a, s) => a + s.units * s.current, 0);
  const netWorth = cumulative + savingsTotal + depositAmt + assetsValue;

  const add = tx => setData(d => ({ ...d, tx: [...d.tx, { ...tx, id: uid() }] }));
  const doReset = () => { try { localStorage.removeItem(STORE); } catch (e) {} setData(EMPTY()); setReset(0); setWord(""); setTab("summary"); };

  // Series for the chart / historical table
  const series = useMemo(() => {
    if (mode === "month") {
      const days = new Date(y, m + 1, 0).getDate();
      return Array.from({ length: days }, (_, i) => {
        const k = `${y}-${pad(m+1)}-${pad(i+1)}`, l = data.tx.filter(t => t.date === k);
        return { key: k, label: `${i+1} ${MONTHS[m].slice(0,3)}`, short: String(i+1), inc: sum(l, "income"), exp: sum(l, "expense"), day: i+1 };
      });
    }
    return MONTHS.map((n, i) => {
      const l = data.tx.filter(t => t.date.startsWith(`${y}-${pad(i+1)}`));
      return { key: i, label: `${n} ${y}`, short: n.slice(0,3), inc: sum(l, "income"), exp: sum(l, "expense") };
    });
  }, [data.tx, mode, y, m]);

  // Historical comparison: months of selected year (month mode) or all years (year mode)
  const history = useMemo(() => {
    if (mode === "month") return series.length && MONTHS.map((n, i) => {
      const l = data.tx.filter(t => t.date.startsWith(`${y}-${pad(i+1)}`));
      return { label: n, short: n.slice(0,3), inc: sum(l, "income"), exp: sum(l, "expense") };
    });
    const ys = [...new Set([y, ...data.tx.map(t => +t.date.slice(0,4))])].sort();
    return ys.map(v => { const l = data.tx.filter(t => t.date.startsWith(String(v))); return { label: String(v), short: String(v), inc: sum(l, "income"), exp: sum(l, "expense") }; });
  }, [data.tx, mode, y, series]);

  const TABS = [["summary","Summary","layout"],["flow","Income & Expenses","arrows"],["savings","Savings & Deposit","bank"],["assets","Assets","brief"]];

  /* ----- Period selector (global) ----- */
  const Period = html`<div className="flex flex-wrap items-center gap-2">
    <div className="flex rounded-lg border border-slate-700 p-0.5 text-sm">
      ${["month","year"].map(v => html`<button key=${v} onClick=${() => setMode(v)} className=${"rounded-md px-3 py-1 " + (mode === v ? "bg-emerald-400 text-slate-900 font-medium" : "text-slate-400 hover:text-slate-200")}>${v === "month" ? "Monthly" : "Yearly"}</button>`)}
    </div>
    <div className="flex items-center gap-1">
      <button aria-label="Previous period" onClick=${() => shift(-1)} className="rounded-lg border border-slate-700 p-2 hover:bg-slate-800"><${Icon} n="left" s=${16}/></button>
      <span className="num min-w-[9.5rem] text-center text-sm font-medium">${label}</span>
      <button aria-label="Next period" onClick=${() => shift(1)} className="rounded-lg border border-slate-700 p-2 hover:bg-slate-800"><${Icon} n="right" s=${16}/></button>
    </div>
    <button onClick=${() => { setY(now.getFullYear()); setM(now.getMonth()); }} className="text-xs text-emerald-400 hover:underline">Today</button>
  </div>`;

  /* ----- Tab 1: Summary ----- */
  const Summary = html`<div className="space-y-4">
    <div className="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">
      <${Stat} label="Net worth" icon="wallet" value=${rp(netWorth)} sub="Savings + deposit + assets + cash flow to period end"/>
      <${Stat} label="Income" icon="up" value=${rp(income)} cls="text-emerald-400" sub=${label}/>
      <${Stat} label="Expenses" icon="down" value=${rp(expense)} cls="text-rose-400" sub=${label}/>
      <${Stat} label=${net >= 0 ? "Profit" : "Loss"} icon="scale" value=${rp(net)} cls=${tone(net)} sub=${label}/>
    </div>
    <div className=${panel}>
      <h2 className="mb-3 font-semibold">${mode === "month" ? `Monthly performance in ${y}` : "Yearly performance"}</h2>
      <${Bars} data=${history}/>
      <div className="mt-4 overflow-x-auto"><table className="num w-full min-w-[420px] text-sm">
        <thead className="text-left text-xs text-slate-500"><tr><th className="py-2">${mode === "month" ? "Month" : "Year"}</th><th className="text-right">Income</th><th className="text-right">Expenses</th><th className="text-right">Profit / Loss</th></tr></thead>
        <tbody>${history.map(r => html`<tr key=${r.label} className="border-t border-slate-800">
          <td className="py-2">${r.label}</td><td className="text-right text-emerald-400">${rp(r.inc)}</td><td className="text-right text-rose-400">${rp(r.exp)}</td><td className=${"text-right " + tone(r.inc - r.exp)}>${rp(r.inc - r.exp)}</td></tr>`)}</tbody>
      </table></div>
    </div>
  </div>`;

  /* ----- Tab 2: Income & Expenses ----- */
  const Flow = html`<${FlowTab} ...${{ mode, y, m, series, periodTx, income, expense, net, label, add, setM, setMode, del: id => setData(d => ({ ...d, tx: d.tx.filter(t => t.id !== id) })) }}/>`;

  /* ----- Tab 3 / 4 ----- */
  const Sav = html`<${SavingsTab} data=${data} setData=${setData} clock=${clock} mode=${mode} label=${label}/>`;
  const Ast = html`<${AssetsTab} data=${data} setData=${setData}/>`;

  return html`<div className="mx-auto max-w-6xl px-3 pb-16 sm:px-6">
    <header className="sticky top-0 z-20 -mx-3 mb-4 border-b border-slate-800 bg-[#0b1114]/95 px-3 py-3 backdrop-blur sm:-mx-6 sm:px-6">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div className="flex items-center gap-2"><span className="grid h-8 w-8 place-items-center rounded-lg bg-emerald-400 text-slate-900"><${Icon} n="wallet" s=${18}/></span><h1 className="text-lg font-semibold">Ledger</h1></div>
        ${Period}
        <button onClick=${() => setReset(1)} className=${btn + " border border-rose-500/50 text-rose-300 hover:bg-rose-500/10"}><${Icon} n="trash" s=${16}/>Delete All Data</button>
      </div>
      <nav className="-mb-3 mt-3 flex gap-1 overflow-x-auto">${TABS.map(([id, name, ic]) => html`<button key=${id} onClick=${() => setTab(id)} className=${"flex shrink-0 items-center gap-2 border-b-2 px-3 py-2 text-sm " + (tab === id ? "border-emerald-400 text-emerald-300" : "border-transparent text-slate-400 hover:text-slate-200")}><${Icon} n=${ic} s=${16}/>${name}</button>`)}</nav>
    </header>
    ${tab === "summary" && Summary}${tab === "flow" && Flow}${tab === "savings" && Sav}${tab === "assets" && Ast}

    ${reset > 0 && html`<div className="fixed inset-0 z-50 grid place-items-center bg-black/70 p-4" role="dialog" aria-modal="true">
      <div className="w-full max-w-md rounded-2xl border border-rose-500/40 bg-[#111a1e] p-5">
        <div className="flex items-center gap-2 text-rose-300"><${Icon} n="alert"/><h3 className="font-semibold">${reset === 1 ? "Reset the application?" : "Final confirmation"}</h3></div>
        ${reset === 1 ? html`<p className="mt-2 text-sm text-slate-400">This permanently deletes every transaction, savings account, deposit and asset. This cannot be undone.</p>` : html`<div><p className="mt-2 text-sm text-slate-400">Type <b className="text-slate-200">DELETE</b> to confirm.</p><input autoFocus className=${inp + " mt-3"} value=${word} onChange=${e => setWord(e.target.value)} placeholder="DELETE"/></div>`}
        <div className="mt-4 flex justify-end gap-2">
          <button className=${btn + " border border-slate-700 hover:bg-slate-800"} onClick=${() => { setReset(0); setWord(""); }}>Cancel</button>
          ${reset === 1 ? html`<button className=${btn + " bg-rose-500 text-white hover:bg-rose-400"} onClick=${() => setReset(2)}>Continue</button>` : html`<button disabled=${word !== "DELETE"} className=${btn + " bg-rose-500 text-white hover:bg-rose-400 disabled:opacity-40"} onClick=${doReset}>Delete everything</button>`}
        </div>
      </div>
    </div>`}
  </div>`;
}

/* ---------- Tab 2 component ---------- */
function FlowTab({ mode, y, m, series, periodTx, income, expense, net, label, add, del, setM, setMode }) {
  const [f, setF] = useState({ type: "expense", amount: "", date: todayStr(), cat: "Food", note: "" });
  const set = (k, v) => setF(s => ({ ...s, [k]: v }));
  const submit = () => {
    const amount = +f.amount; if (!amount || amount <= 0 || !f.date) return;
    add({ type: f.type, amount, date: f.date, cat: f.cat, note: f.note.trim() });
    setF(s => ({ ...s, amount: "", note: "" }));
  };
  const first = new Date(y, m, 1).getDay();                              // weekday offset (Sun = 0)
  const cells = mode === "month" ? [...Array(first).fill(null), ...series] : series;
  const sorted = [...periodTx].sort((a, b) => b.date.localeCompare(a.date));

  return html`<div className="space-y-4">
    <div className=${"rounded-2xl border p-4 sm:p-5 " + (net >= 0 ? "border-emerald-500/30 bg-emerald-500/5" : "border-rose-500/30 bg-rose-500/5")}>
      <div className="text-sm text-slate-400">${net >= 0 ? "Profit" : "Loss"} for ${label}</div>
      <div className=${"num text-3xl font-semibold " + tone(net)}>${rp(net)}</div>
      <div className="num mt-1 text-sm text-slate-400">Income ${rp(income)} · Expenses ${rp(expense)}</div>
    </div>

    <div className="grid gap-4 lg:grid-cols-3">
      <div className=${panel + " lg:col-span-1"}>
        <h2 className="mb-3 font-semibold">Add transaction</h2>
        <div className="space-y-3">
          <div className="grid grid-cols-2 gap-2">${[["income","Earning"],["expense","Loss / Spending"]].map(([v, n]) => html`<button key=${v} onClick=${() => set("type", v)} className=${"rounded-lg border px-3 py-2 text-sm " + (f.type === v ? (v === "income" ? "border-emerald-400 bg-emerald-400/10 text-emerald-300" : "border-rose-400 bg-rose-400/10 text-rose-300") : "border-slate-700 text-slate-400")}>${n}</button>`)}</div>
          <${Field} label="Amount (Rp)"><input type="number" min="0" className=${inp} value=${f.amount} onChange=${e => set("amount", e.target.value)} placeholder="0"/><//>
          <${Field} label="Date"><input type="date" className=${inp} value=${f.date} onChange=${e => set("date", e.target.value)}/><//>
          <${Field} label="Category"><select className=${inp} value=${f.cat} onChange=${e => set("cat", e.target.value)}>${CATS.map(c => html`<option key=${c}>${c}</option>`)}</select><//>
          <${Field} label="Additional Info"><textarea rows="2" className=${inp} value=${f.note} onChange=${e => set("note", e.target.value)} placeholder="What was this for? e.g. Freelance invoice, groceries…"/><//>
          <button onClick=${submit} className=${btn + " w-full bg-emerald-400 text-slate-900 hover:bg-emerald-300"}><${Icon} n="plus" s=${16}/>Add transaction</button>
        </div>
      </div>

      <div className=${panel + " lg:col-span-2"}>
        <h2 className="mb-3 font-semibold">${mode === "month" ? "Income vs spending by day" : "Income vs spending by month"}</h2>
        <${Bars} data=${series}/>
      </div>
    </div>

    <div className=${panel}>
      <h2 className="mb-3 flex items-center gap-2 font-semibold"><${Icon} n="cal" s=${16}/>${mode === "month" ? "Calendar — " + label : "Timeline — " + y}</h2>
      ${mode === "month" && html`<div className="mb-1 grid grid-cols-7 gap-1 text-center text-xs text-slate-500">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d => html`<div key=${d}>${d}</div>`)}</div>`}
      <div className=${"grid gap-1 " + (mode === "month" ? "grid-cols-7" : "grid-cols-2 sm:grid-cols-4")}>
        ${cells.map((c, i) => !c ? html`<div key=${"b" + i}/>` : html`<button key=${i} onClick=${() => mode === "month" ? set("date", c.key) : (setM(c.key), setMode("month"))} className=${"min-h-[3.5rem] rounded-lg border p-1 text-left text-[11px] hover:border-emerald-400/60 sm:min-h-[4.5rem] sm:p-2 sm:text-xs " + (f.date === c.key ? "border-emerald-400" : "border-slate-800")}>
          <div className="text-slate-400">${mode === "month" ? c.day : MONTHS[c.key]}</div>
          ${c.inc > 0 && html`<div className="num truncate text-emerald-400">+${compact(c.inc)}</div>`}
          ${c.exp > 0 && html`<div className="num truncate text-rose-400">−${compact(c.exp)}</div>`}
        </button>`)}
      </div>
      <p className="mt-2 text-xs text-slate-500">${mode === "month" ? "Click a day to use it as the date in the form." : "Click a month to open its daily calendar."}</p>
    </div>

    <div className=${panel}>
      <h2 className="mb-3 font-semibold">Transactions — ${label}</h2>
      ${sorted.length === 0 ? html`<${Empty} icon="arrows" text="No transactions in this period. Add your first one using the form."/>` :
      html`<ul className="divide-y divide-slate-800">${sorted.map(t => html`<li key=${t.id} className="flex items-start justify-between gap-3 py-2.5 text-sm">
        <div className="min-w-0"><div className="font-medium">${t.cat} <span className="text-xs font-normal text-slate-500">${t.date}</span></div>${t.note && html`<div className="break-words text-xs text-slate-400">${t.note}</div>`}</div>
        <div className="flex shrink-0 items-center gap-2"><span className=${"num " + (t.type === "income" ? "text-emerald-400" : "text-rose-400")}>${t.type === "income" ? "+" : "−"}${rp(t.amount)}</span>
        <button aria-label="Delete transaction" onClick=${() => del(t.id)} className="rounded p-1 text-slate-500 hover:text-rose-400"><${Icon} n="trash" s=${15}/></button></div></li>`)}</ul>`}
    </div>
  </div>`;
}

/* ---------- Tab 3 component ---------- */
function SavingsTab({ data, setData, clock, mode, label }) {
  const upS = (i, p) => setData(d => ({ ...d, savings: d.savings.map((s, j) => j === i ? { ...s, ...p } : s) }));
  const upD = p => setData(d => ({ ...d, deposit: { ...d.deposit, ...p } }));
  const dep = data.deposit, amt = +dep.amount || 0, rate = +dep.rate || 0, term = +dep.term || 0;
  const start = new Date(dep.start + "T00:00:00");
  const mat = new Date(start.getFullYear(), start.getMonth() + term, start.getDate());
  // Compound interest: A = P(1 + r/n)^(n·t), n = compounding periods per year, t = term in years
  const n = +dep.freq || 12;
  const interest = amt * Math.pow(1 + rate / 100 / n, n * term / 12) - amt;
  const eay = (Math.pow(1 + rate / 100 / n, n) - 1) * 100;          // effective annual yield
  const prog = Math.min(1, Math.max(0, (Date.now() - start) / Math.max(1, mat - start)));
  const days = Math.ceil((mat - Date.now()) / 864e5);
  const total = data.savings.reduce((a, s) => a + (+s.balance || 0), 0);

  return html`<div className="space-y-4">
    <div className=${panel + " flex flex-wrap items-center justify-between gap-2"}>
      <div><div className="text-xs text-slate-400">Today</div><div className="font-semibold">${clock.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}</div></div>
      <div className="text-right"><div className="text-xs text-slate-400">Active period</div><div className="font-semibold">${label}</div></div>
      <div className="num text-2xl font-semibold">${clock.toLocaleTimeString("en-GB")}</div>
    </div>

    <h2 className="font-semibold">Savings accounts <span className="num ml-2 text-sm font-normal text-slate-400">Total ${rp(total)}</span></h2>
    <div className="grid gap-4 md:grid-cols-3">${data.savings.map((s, i) => {
      const b = +s.balance || 0, r = +s.rate || 0;
      const next = b * r / 100 / (mode === "month" ? 12 : 1);          // projected growth for the next period
      return html`<div key=${i} className=${panel + " space-y-3"}>
        <${Field} label=${"Account " + (i + 1) + " name"}><input className=${inp} value=${s.name} onChange=${e => upS(i, { name: e.target.value })} placeholder="e.g. Emergency fund"/><//>
        <${Field} label="Balance (Rp)"><input type="number" min="0" className=${inp} value=${s.balance || ""} onChange=${e => upS(i, { balance: +e.target.value })} placeholder="0"/><//>
        <${Field} label="Interest rate (% p.a.)"><input type="number" min="0" step="0.01" className=${inp} value=${s.rate || ""} onChange=${e => upS(i, { rate: +e.target.value })} placeholder="0"/><//>
        <div className="rounded-lg bg-[#0b1114] p-3 text-sm"><div className="text-xs text-slate-400">Projected growth next ${mode}</div>
          <div className="num font-semibold text-emerald-400">+${rp(next)}</div><div className="num text-xs text-slate-500">Balance after: ${rp(b + next)}</div></div>
      </div>`; })}</div>

    <div className=${panel}>
      <h2 className="mb-3 font-semibold">Fixed deposit</h2>
      <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-5">
        <${Field} label="Deposit amount (Rp)"><input type="number" min="0" className=${inp} value=${dep.amount || ""} onChange=${e => upD({ amount: +e.target.value })} placeholder="0"/><//>
        <${Field} label="Interest rate (% p.a.)"><input type="number" min="0" step="0.01" className=${inp} value=${dep.rate || ""} onChange=${e => upD({ rate: +e.target.value })} placeholder="0"/><//>
        <${Field} label="Term (months)"><input type="number" min="1" className=${inp} value=${dep.term || ""} onChange=${e => upD({ term: +e.target.value })}/><//>
        <${Field} label="Start date"><input type="date" className=${inp} value=${dep.start} onChange=${e => e.target.value && upD({ start: e.target.value })}/><//>
        <${Field} label="Compounding"><select className=${inp} value=${n} onChange=${e => upD({ freq: +e.target.value })}><option value=${12}>Monthly</option><option value=${4}>Quarterly</option><option value=${1}>Annually</option></select><//>
      </div>
      ${amt > 0 ? html`<div className="mt-4 grid gap-3 sm:grid-cols-3">
        <div className="rounded-lg bg-[#0b1114] p-3"><div className="text-xs text-slate-400">Maturity date</div><div className="font-semibold">${fmtDate(mat)}</div><div className="text-xs text-slate-500">${days > 0 ? days + " days left" : "Matured"}</div></div>
        <div className="rounded-lg bg-[#0b1114] p-3"><div className="text-xs text-slate-400">Compound interest at maturity</div><div className="num font-semibold text-emerald-400">+${rp(interest)}</div><div className="text-xs text-slate-500">${n === 12 ? "Monthly" : n === 4 ? "Quarterly" : "Annual"} compounding · effective ${eay.toFixed(2)}% p.a.</div></div>
        <div className="rounded-lg bg-[#0b1114] p-3"><div className="text-xs text-slate-400">Value at maturity</div><div className="num font-semibold">${rp(amt + interest)}</div></div>
        <div className="sm:col-span-3"><div className="h-2 overflow-hidden rounded bg-slate-800"><div className="h-full bg-emerald-400" style=${{ width: prog * 100 + "%" }}></div></div><div className="mt-1 text-xs text-slate-500">${Math.round(prog * 100)}% of term elapsed</div></div>
      </div>` : html`<p className="mt-3 text-sm text-slate-500">Enter an amount, rate and term to see maturity details.</p>`}
    </div>
  </div>`;
}

/* ---------- Tab 4 component ---------- */
const ATYPES = ["Stock","Bond","Mutual Fund","Other"];
function AssetsTab({ data, setData }) {
  const blank = { name: "", type: "Stock", units: "", buy: "", current: "" };
  const [f, setF] = useState(blank);
  const set = (k, v) => setF(s => ({ ...s, [k]: v }));
  const submit = () => {
    if (!f.name.trim() || !(+f.units > 0)) return;
    setData(d => ({ ...d, assets: [...d.assets, { id: uid(), name: f.name.trim(), type: f.type, units: +f.units, buy: +f.buy || 0, current: +f.current || 0 }] }));
    setF(blank);
  };
  const upd = (id, p) => setData(d => ({ ...d, assets: d.assets.map(a => a.id === id ? { ...a, ...p } : a) }));
  const A = data.assets;
  const cost = A.reduce((a, x) => a + x.units * x.buy, 0), val = A.reduce((a, x) => a + x.units * x.current, 0), gain = val - cost;
  const byType = ATYPES.map(t => ({ t, v: A.filter(x => x.type === t).reduce((a, x) => a + x.units * x.current, 0) })).filter(x => x.v > 0);
  const cols = { Stock: "bg-emerald-400", Bond: "bg-sky-400", "Mutual Fund": "bg-amber-400", Other: "bg-slate-400" };

  return html`<div className="space-y-4">
    <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">
      <${Stat} label="Current value" icon="brief" value=${rp(val)}/>
      <${Stat} label="Total cost" icon="wallet" value=${rp(cost)}/>
      <${Stat} label="Gain / loss" icon=${gain >= 0 ? "up" : "down"} value=${rp(gain)} cls=${tone(gain)} sub=${cost > 0 ? ((gain / cost) * 100).toFixed(2) + "%" : "0%"}/>
    </div>
    <div className=${panel}>
      <h2 className="mb-3 font-semibold">Add holding</h2>
      <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-6">
        <div className="lg:col-span-2"><${Field} label="Asset name"><input className=${inp} value=${f.name} onChange=${e => set("name", e.target.value)} placeholder="e.g. BBCA"/><//></div>
        <${Field} label="Type"><select className=${inp} value=${f.type} onChange=${e => set("type", e.target.value)}>${ATYPES.map(t => html`<option key=${t}>${t}</option>`)}</select><//>
        <${Field} label="Units"><input type="number" min="0" className=${inp} value=${f.units} onChange=${e => set("units", e.target.value)} placeholder="0"/><//>
        <${Field} label="Purchase price / unit"><input type="number" min="0" className=${inp} value=${f.buy} onChange=${e => set("buy", e.target.value)} placeholder="0"/><//>
        <${Field} label="Current price / unit"><input type="number" min="0" className=${inp} value=${f.current} onChange=${e => set("current", e.target.value)} placeholder="0"/><//>
      </div>
      <button onClick=${submit} className=${btn + " mt-3 bg-emerald-400 text-slate-900 hover:bg-emerald-300"}><${Icon} n="plus" s=${16}/>Add asset</button>
    </div>
    <div className=${panel}>
      <h2 className="mb-3 font-semibold">Investment breakdown</h2>
      ${val === 0 ? html`<${Empty} icon="brief" text="No holdings yet. Add a stock, bond or mutual fund above."/>` : html`<div>
        <div className="flex h-3 overflow-hidden rounded bg-slate-800">${byType.map(x => html`<div key=${x.t} className=${cols[x.t]} style=${{ width: x.v / val * 100 + "%" }}></div>`)}</div>
        <div className="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-400">${byType.map(x => html`<span key=${x.t} className="flex items-center gap-1"><i className=${"h-2 w-2 rounded-full " + cols[x.t]}></i>${x.t} ${(x.v / val * 100).toFixed(1)}% · ${rp(x.v)}</span>`)}</div>
        <div className="mt-4 overflow-x-auto"><table className="num w-full min-w-[640px] text-sm">
          <thead className="text-left text-xs text-slate-500"><tr><th className="py-2">Name</th><th>Type</th><th className="text-right">Units</th><th className="text-right">Buy price</th><th className="text-right">Current price</th><th className="text-right">Value</th><th className="text-right">Gain / loss</th><th></th></tr></thead>
          <tbody>${A.map(a => { const g = a.units * (a.current - a.buy); return html`<tr key=${a.id} className="border-t border-slate-800">
            <td className="py-2 font-medium">${a.name}</td><td className="text-slate-400">${a.type}</td><td className="text-right">${a.units}</td><td className="text-right">${rp(a.buy)}</td>
            <td className="text-right"><input type="number" aria-label="Current price" className="w-28 rounded border border-slate-700 bg-[#0b1114] px-2 py-1 text-right" value=${a.current} onChange=${e => upd(a.id, { current: +e.target.value })}/></td>
            <td className="text-right">${rp(a.units * a.current)}</td><td className=${"text-right " + tone(g)}>${rp(g)}</td>
            <td className="text-right"><button aria-label="Delete asset" onClick=${() => setData(d => ({ ...d, assets: d.assets.filter(x => x.id !== a.id) }))} className="p-1 text-slate-500 hover:text-rose-400"><${Icon} n="trash" s=${15}/></button></td></tr>`; })}</tbody>
        </table></div></div>`}
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
